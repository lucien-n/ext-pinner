name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      - name: Build app
        run: bun run build

      - name: Bundle build folder
        run: cd build && zip -r ../pinner-${{ github.ref_name }}.zip .

      - name: Create GitHub release
        uses: anton-yurchenko/git-release@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: pinner-${{ github.ref_name }}.zip

      - name: Publish to Chrome Web Store
        uses: puzzlers-labs/chrome-webstore-publish@v1
        with:
          mode: publish
          extension_id: ${{ vars.CHROME_EXTENSION_ID }}
          zip_file_path: pinner-${{ github.ref_name }}.zip
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish_target: public

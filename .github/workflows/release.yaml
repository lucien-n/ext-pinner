name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Create GitHub release
        uses: anton-yurchenko/git-release@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
